name: ios
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  pull_request:
    types: [labeled]
jobs:
  ios:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test ! -f FAIL || { echo "FAIL file present"; exit 1; }
